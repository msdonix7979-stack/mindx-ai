
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZYROX — Think Beyond</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>

<style>
:root {
  --bg: #09090f;
  --panel: #11111b;
  --panel2: #181827;
  --border: #29283b;
  --text: #f4f1ff;
  --muted: #9995ad;
  --purple: #8b5cf6;
  --purple2: #6d42d8;
  --user: #29213e;
  --danger: #ff647c;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, Arial, sans-serif;
}

button, textarea, input { font: inherit; }

button { cursor: pointer; }

.app {
  display: flex;
  height: 100vh;
  width: 100%;
}

/* SIDEBAR */

.sidebar {
  width: 270px;
  min-width: 270px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px;
  transition: transform .25s ease;
  z-index: 20;
}

.brand {
  font-size: 25px;
  font-weight: 850;
  letter-spacing: 2px;
  margin: 8px 0 25px;
}

.brand span { color: var(--purple); }

.new-chat {
  background: linear-gradient(135deg,var(--purple),var(--purple2));
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 13px;
  font-weight: 700;
  width: 100%;
  margin-bottom: 20px;
}

.side-label {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 1.5px;
  margin: 8px 0;
}

.history {
  flex: 1;
  overflow-y: auto;
}

.chat-item {
  padding: 11px;
  border-radius: 9px;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 4px;
  font-size: 13px;
}

.chat-item:hover, .chat-item.active {
  background: var(--panel2);
  color: white;
}

.chat-item-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chat-actions {
  display: flex;
  gap: 5px;
}

.chat-actions button {
  background: none;
  border: 0;
  color: var(--muted);
  padding: 0 2px;
}

.side-bottom {
  border-top: 1px solid var(--border);
  padding-top: 15px;
}

.side-bottom button {
  width: 100%;
  text-align: left;
  background: transparent;
  color: var(--muted);
  border: 0;
  padding: 9px;
  border-radius: 8px;
}

.side-bottom button:hover { background: var(--panel2); color: white; }

/* MAIN */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}

.topbar {
  min-height: 68px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  gap: 12px;
}

.top-left, .top-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.top-title {
  font-weight: 750;
  letter-spacing: .5px;
}

.status {
  color: #5ddba0;
  font-size: 11px;
  background: #123225;
  border-radius: 20px;
  padding: 5px 9px;
}

.mode-select {
  background: var(--panel2);
  color: white;
  border: 1px solid var(--border);
  padding: 9px 12px;
  border-radius: 10px;
  outline: none;
  max-width: 145px;
}

.icon-btn {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: white;
  border-radius: 9px;
  padding: 9px 11px;
}

/* CHAT AREA */

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 30px 18px 45px;
  scroll-behavior: smooth;
}

.chat-inner {
  max-width: 850px;
  margin: auto;
}

.welcome {
  min-height: 65vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.logo-glow {
  width: 65px;
  height: 65px;
  border-radius: 22px;
  display: grid;
  place-items: center;
  font-size: 30px;
  font-weight: 900;
  background: linear-gradient(135deg,#a78bfa,#6d42d8);
  box-shadow: 0 0 45px #8b5cf655;
  margin-bottom: 20px;
}

.welcome h1 {
  font-size: clamp(28px,5vw,43px);
  margin: 5px 0;
}

.gradient-text {
  background: linear-gradient(90deg,#c4a8ff,#8b5cf6,#d5baff);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.welcome p {
  color: var(--muted);
  max-width: 520px;
  line-height: 1.7;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 12px;
  width: 100%;
  max-width: 620px;
  margin-top: 25px;
}

.suggestion {
  text-align: left;
  border: 1px solid var(--border);
  background: var(--panel);
  color: white;
  border-radius: 13px;
  padding: 15px;
  line-height: 1.5;
}

.suggestion:hover {
  border-color: var(--purple);
  transform: translateY(-2px);
}

/* MESSAGES */

.message {
  display: flex;
  gap: 12px;
  margin: 22px 0;
  align-items: flex-start;
}

.avatar {
  width: 34px;
  height: 34px;
  min-width: 34px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-weight: 800;
  background: linear-gradient(135deg,#8b5cf6,#5432a8);
}

.user-avatar { background: #393047; }

.message-content {
  min-width: 0;
  max-width: calc(100% - 46px);
  line-height: 1.75;
  overflow-wrap: anywhere;
}

.message.user .message-content {
  background: var(--user);
  padding: 12px 16px;
  border-radius: 5px 15px 15px 15px;
}

.message-content p { margin: 0 0 12px; }
.message-content p:last-child { margin-bottom: 0; }

.message-content pre {
  background: #080811;
  border: 1px solid var(--border);
  padding: 15px;
  overflow-x: auto;
  border-radius: 10px;
}

.message-content code {
  background: #262039;
  padding: 2px 5px;
  border-radius: 5px;
  font-size: .9em;
}

.message-content pre code {
  background: none;
  padding: 0;
}

.message-content table {
  border-collapse: collapse;
  width: 100%;
  margin: 12px 0;
}

.message-content th, .message-content td {
  border: 1px solid var(--border);
  padding: 9px;
  text-align: left;
}

.message-content th { background: var(--panel2); }

.message-tools {
  display: flex;
  gap: 7px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.message-tools button {
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 5px 9px;
  font-size: 11px;
}

.message-tools button:hover {
  color: white;
  border-color: var(--purple);
}

.typing {
  display: flex;
  gap: 5px;
  padding: 10px;
}

.typing span {
  width: 7px;
  height: 7px;
  background: var(--purple);
  border-radius: 50%;
  animation: bounce .8s infinite alternate;
}

.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }

@keyframes bounce {
  to { transform: translateY(-7px); opacity: .4; }
}

/* COMPOSER */

.composer-wrap {
  padding: 12px 18px 18px;
  background: linear-gradient(transparent,var(--bg) 25%);
}

.composer {
  max-width: 850px;
  margin: auto;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 12px;
  box-shadow: 0 8px 35px #0004;
}

.composer textarea {
  display: block;
  width: 100%;
  resize: none;
  border: 0;
  outline: 0;
  color: white;
  background: transparent;
  padding: 7px;
  min-height: 48px;
  max-height: 180px;
  font-size: 15px;
  line-height: 1.5;
}

.composer textarea::placeholder { color: #77738b; }

.composer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.composer-tools {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.tool-btn {
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 8px 10px;
  border-radius: 9px;
  font-size: 12px;
}

.tool-btn:hover { color: white; border-color: var(--purple); }

.send-btn {
  background: var(--purple);
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 10px 17px;
  font-weight: 700;
}

.send-btn:hover { background: var(--purple2); }

.disclaimer {
  text-align: center;
  color: var(--muted);
  font-size: 10px;
  margin-top: 9px;
}

/* IMAGE PREVIEW */

.image-preview {
  display: none;
  gap: 9px;
  flex-wrap: wrap;
  padding: 8px 5px;
}

.image-preview img {
  width: 65px;
  height: 65px;
  object-fit: cover;
  border-radius: 9px;
  border: 1px solid var(--border);
}

.image-chip {
  position: relative;
}

.image-chip button {
  position: absolute;
  right: -5px;
  top: -5px;
  background: var(--danger);
  color: white;
  border: 0;
  border-radius: 50%;
  width: 19px;
  height: 19px;
}

/* MOBILE */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 15;
}

@media(max-width:700px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-110%);
    width: 280px;
  }

  .sidebar.open { transform: translateX(0); }
  .overlay.show { display: block; }

  .topbar { padding: 0 12px; }
  .top-title { font-size: 14px; }
  .status { display: none; }

  .chat-area { padding: 20px 12px; }
  .composer-wrap { padding: 8px 10px 12px; }

  .suggestions { grid-template-columns: 1fr; }
  .welcome { min-height: 55vh; }

  .mode-select {
    max-width: 115px;
    font-size: 12px;
    padding: 8px 5px;
  }

  .top-right { gap: 6px; }
}

@media(min-width:701px) {
  .mobile-menu { display: none; }
}
</style>
</head>

<body>
<div class="app">

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">ZYRO<span>X</span></div>

    <button class="new-chat" onclick="newChat()">＋ New Chat</button>

    <div class="side-label">YOUR CONVERSATIONS</div>
    <div class="history" id="history"></div>

    <div class="side-bottom">
      <button onclick="exportChats()">⇩ Export conversations</button>
      <button onclick="clearAllChats()">⌫ Clear all chats</button>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn mobile-menu" onclick="openSidebar()">☰</button>
        <div class="top-title">ZYROX <span style="color:var(--purple)">/</span> Chat</div>
        <div class="status" id="status">● Online</div>
      </div>

      <div class="top-right">
        <select class="mode-select" id="mode" title="Choose response mode">
          <option value="instant">⚡ Instant</option>
          <option value="balanced" selected>◈ Balanced</option>
          <option value="deep">✦ Deep</option>
        </select>
      </div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="chat-inner" id="chatInner"></div>
    </section>

    <div class="composer-wrap">
      <div class="composer">

        <div class="image-preview" id="imagePreview"></div>

        <textarea
          id="prompt"
          placeholder="Message ZYROX... Ask anything."
          rows="1"
          onkeydown="handleEnter(event)"
          oninput="resizeInput(this)"
        ></textarea>

        <div class="composer-bottom">
          <div class="composer-tools">
            <button class="tool-btn" onclick="document.getElementById('imageInput').click()">＋ Image</button>
            <button class="tool-btn" onclick="createImagePDF()">▤ Create PDF</button>
            <button class="tool-btn" onclick="document.getElementById('fileInput').click()">＋ Text/PDF</button>
            <button class="tool-btn" id="voiceButton" onclick="toggleVoiceInput()">🎙 Voice</button>
            <button class="tool-btn" id="speakToggle" onclick="toggleSpeak()">🔊 Read replies: OFF</button>
          </div>

          <button class="send-btn" id="sendButton" onclick="sendMessage()">Send ↑</button>
        </div>
      </div>

      <div class="disclaimer">
        ZYROX can make mistakes. Check important information.
      </div>
    </div>

  </main>
</div>

<input type="file" id="imageInput" accept="image/*" multiple hidden onchange="handleImages(event)">
<input type="file" id="fileInput" accept=".txt,.md,.csv,.json,.pdf" hidden onchange="handleTextFile(event)">

<script>
/* =========================================
   ZYROX CONFIGURATION
========================================= */

const API_URL = "https://mindx-ai-backend.msdonix7979.workers.dev/api/chat";
const STORAGE_KEY = "mindx-ai-chats-v1";

const SYSTEM_PROMPT = `
You are ZYROX, a capable, helpful and intelligent AI assistant.

Your goals:
1. Understand the user's actual question before answering.
2. Remember the conversation context and connect follow-up questions to earlier messages.
3. Do not ask the user to repeat information already provided.
4. Give accurate, clear and useful answers.
5. Explain difficult concepts in beginner-friendly language when appropriate.
6. Use headings, bullet points, tables and code blocks when useful.
7. For coding requests, provide complete, usable code when requested.
8. If information is uncertain, say so instead of inventing facts.
9. Follow the user's requested language and format.
10. Avoid unnecessary repetition and irrelevant information.
11. Be conversational, respectful and helpful.

You are ZYROX. Do not claim to have capabilities that are not available.
`;

/* =========================================
   APP STATE
========================================= */

let chats = [];
let currentId = null;
let controller = null;
let uploadedImages = [];
let pendingFileText = "";
let recognition = null;
let listening = false;
let speakReplies = false;

try {
  chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  if (!Array.isArray(chats)) chats = [];
} catch {
  chats = [];
}

function saveChats() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
}

function id() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function getCurrentChat() {
  return chats.find(c => c.id === currentId);
}

function ensureChat() {
  if (!getCurrentChat()) newChat();
  return getCurrentChat();
}

/* =========================================
   SIDEBAR
========================================= */

function openSidebar() {
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("overlay").classList.add("show");
}

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSidebar();
});

function newChat() {
  const chat = {
    id: id(),
    title: "New conversation",
    messages: [],
    pinned: false,
    updated: Date.now()
  };

  chats.unshift(chat);
  currentId = chat.id;
  saveChats();
  renderHistory();
  renderChat();
  closeSidebar();
  document.getElementById("prompt").focus();
}

function selectChat(chatId) {
  currentId = chatId;
  renderHistory();
  renderChat();
  closeSidebar();
}

function renameChat(chatId) {
  const chat = chats.find(c => c.id === chatId);
  if (!chat) return;

  const name = prompt("Enter conversation name:", chat.title);
  if (name && name.trim()) {
    chat.title = name.trim();
    saveChats();
    renderHistory();
  }
}

function togglePin(chatId) {
  const chat = chats.find(c => c.id === chatId);
  if (!chat) return;
  chat.pinned = !chat.pinned;
  saveChats();
  renderHistory();
}

function deleteChat(chatId) {
  if (!confirm("Delete this conversation?")) return;

  chats = chats.filter(c => c.id !== chatId);

  if (currentId === chatId) {
    currentId = chats[0]?.id || null;
  }

  if (!currentId) newChat();

  saveChats();
  renderHistory();
  renderChat();
}

function renderHistory() {
  const history = document.getElementById("history");
  history.innerHTML = "";

  const ordered = [...chats].sort((a,b) => {
    if (a.pinned !== b.pinned) return b.pinned - a.pinned;
    return b.updated - a.updated;
  });

  ordered.forEach(chat => {
    const item = document.createElement("div");
    item.className = "chat-item" + (chat.id === currentId ? " active" : "");

    const title = document.createElement("span");
    title.className = "chat-item-title";
    title.textContent = (chat.pinned ? "📌 " : "") + chat.title;
    title.onclick = () => selectChat(chat.id);

    const actions = document.createElement("span");
    actions.className = "chat-actions";

    const rename = document.createElement("button");
    rename.textContent = "✎";
    rename.title = "Rename";
    rename.onclick = e => { e.stopPropagation(); renameChat(chat.id); };

    const pin = document.createElement("button");
    pin.textContent = "⌖";
    pin.title = "Pin";
    pin.onclick = e => { e.stopPropagation(); togglePin(chat.id); };

    const del = document.createElement("button");
    del.textContent = "×";
    del.title = "Delete";
    del.onclick = e => { e.stopPropagation(); deleteChat(chat.id); };

    actions.append(rename,pin,del);
    item.append(title,actions);
    history.appendChild(item);
  });
}

/* =========================================
   CHAT DISPLAY
========================================= */

function showWelcome() {
  return `
    <div class="welcome">
      <div class="logo-glow">Z</div>
      <h1>Think <span class="gradient-text">Beyond.</span></h1>
      <p>Your ideas, questions and creativity deserve more.
      Welcome to ZYROX — your intelligent AI workspace.</p>

      <div class="suggestions">
        <button class="suggestion" onclick="suggest('Explain a difficult topic in simple words.')">
          📚 <b>Learn something</b><br>
          <small>Understand any topic step by step.</small>
        </button>

        <button class="suggestion" onclick="suggest('Help me write a program and explain the code.')">
          💻 <b>Build something</b><br>
          <small>Code, debug and create projects.</small>
        </button>

        <button class="suggestion" onclick="suggest('Give me creative ideas for a new project.')">
          💡 <b>Explore ideas</b><br>
          <small>Discover new possibilities.</small>
        </button>

        <button class="suggestion" onclick="suggest('Help me make a study plan for my exams.')">
          🎯 <b>Get organized</b><br>
          <small>Plan your goals and studies.</small>
        </button>
      </div>
    </div>`;
}

function renderChat() {
  const inner = document.getElementById("chatInner");
  const chat = getCurrentChat();

  if (!chat || !chat.messages.length) {
    inner.innerHTML = showWelcome();
    return;
  }

  inner.innerHTML = "";

  chat.messages.forEach((message,index) => {
    inner.appendChild(createMessageElement(message,index));
  });

  scrollBottom();
}

function createMessageElement(message,index) {
  const wrapper = document.createElement("div");
  wrapper.className = "message " + message.role;

  const avatar = document.createElement("div");
  avatar.className = "avatar" + (message.role === "user" ? " user-avatar" : "");
  avatar.textContent = message.role === "user" ? "U" : "Z";

  const content = document.createElement("div");
  content.className = "message-content";

  if (message.role === "assistant") {
    const html = marked.parse(message.content || "");
    content.innerHTML = DOMPurify.sanitize(html);

    const tools = document.createElement("div");
    tools.className = "message-tools";

    const copy = document.createElement("button");
    copy.textContent = "Copy";
    copy.onclick = () => {
      navigator.clipboard.writeText(message.content || "");
      copy.textContent = "Copied!";
      setTimeout(() => copy.textContent = "Copy",1200);
    };

    const speak = document.createElement("button");
    speak.textContent = "🔊 Read aloud";
    speak.onclick = () => speakText(message.content || "");

    const pdf = document.createElement("button");
    pdf.textContent = "Create PDF";
    pdf.onclick = () => createResponsePDF(message.content || "");

    tools.append(copy,speak,pdf);
    content.appendChild(tools);
  } else {
    content.textContent = message.content || "";
  }

  wrapper.append(avatar,content);
  return wrapper;
}

function addMessage(role,content) {
  const chat = ensureChat();

  chat.messages.push({role,content});
  chat.updated = Date.now();

  if (chat.messages.filter(m => m.role === "user").length === 1) {
    chat.title = content.slice(0,38) || "New conversation";
  }

  saveChats();
  renderHistory();
  renderChat();
}

function scrollBottom() {
  const area = document.getElementById("chatArea");
  area.scrollTop = area.scrollHeight;
}

/* =========================================
   MODES
========================================= */

function getModeInstruction() {
  const mode = document.getElementById("mode").value;

  if (mode === "instant") {
    return "RESPONSE MODE: INSTANT. Prioritize speed, direct answers and concise explanations. Avoid unnecessary detail.";
  }

  if (mode === "deep") {
    return "RESPONSE MODE: DEEP. Give thorough explanations, examine important aspects, show step-by-step solutions when useful, and mention relevant limitations. Do not reveal private chain-of-thought; provide concise reasoning summaries instead.";
  }

  return "RESPONSE MODE: BALANCED. Give clear, useful answers with enough explanation and examples, without unnecessary length.";
}

/* =========================================
   SEND MESSAGE
========================================= */

function suggest(text) {
  document.getElementById("prompt").value = text;
  sendMessage();
}

function handleEnter(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function resizeInput(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight,180) + "px";
}

function setStatus(text,error=false) {
  const status = document.getElementById("status");
  status.textContent = text;
  status.style.color = error ? "#ff647c" : "#5ddba0";
}

function showTyping() {
  const inner = document.getElementById("chatInner");

  const wrapper = document.createElement("div");
  wrapper.className = "message";
  wrapper.id = "typingMessage";

  wrapper.innerHTML = `
    <div class="avatar">Z</div>
    <div class="typing"><span></span><span></span><span></span></div>
  `;

  inner.appendChild(wrapper);
  scrollBottom();
}

function removeTyping() {
  document.getElementById("typingMessage")?.remove();
}

async function sendMessage() {
  const input = document.getElementById("prompt");
  const text = input.value.trim();

  if (!text && !pendingFileText) return;
  if (controller) return;

  const finalText = text + (pendingFileText
    ? "\n\nUploaded document content:\n" + pendingFileText
    : "");

  pendingFileText = "";
  input.value = "";
  resizeInput(input);

  addMessage("user",finalText);

  const chat = getCurrentChat();
  const modeInstruction = getModeInstruction();

  const context = chat.messages.slice(-20).map(m => ({
    role: m.role,
    content: m.content
  }));

  showTyping();
  setStatus("● Thinking");

  controller = new AbortController();

  document.getElementById("sendButton").textContent = "Stop";
  document.getElementById("sendButton").onclick = stopGeneration;

  try {
    const response = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      signal:controller.signal,
      body:JSON.stringify({
        messages:[
          {
            role:"system",
            content:SYSTEM_PROMPT + "\n\n" + modeInstruction
          },
          ...context
        ]
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Server error: " + response.status);
    }

    const answer =
      data.choices?.[0]?.message?.content ||
      data.reply ||
      data.message ||
      "";

    if (!answer) throw new Error("The AI returned an empty response.");

    removeTyping();
    addMessage("assistant",answer);

    if (speakReplies) speakText(answer);

    setStatus("● Online");

  } catch(error) {
    removeTyping();

    if (error.name === "AbortError") {
      setStatus("● Stopped");
    } else {
      addMessage("assistant","**Connection error:** " + error.message);
      setStatus("● Connection issue",true);
    }
  } finally {
    controller = null;
    document.getElementById("sendButton").textContent = "Send ↑";
    document.getElementById("sendButton").onclick = sendMessage;
  }
}

function stopGeneration() {
  if (controller) controller.abort();
}

/* =========================================
   IMAGE UPLOAD AND IMAGE PDF
========================================= */

function handleImages(event) {
  const files = Array.from(event.target.files || []);

  files.forEach(file => {
    if (!file.type.startsWith("image/")) return;

    uploadedImages.push(file);
  });

  event.target.value = "";
  renderImagePreview();
}

function renderImagePreview() {
  const preview = document.getElementById("imagePreview");
  preview.innerHTML = "";
  preview.style.display = uploadedImages.length ? "flex" : "none";

  uploadedImages.forEach((file,index) => {
    const chip = document.createElement("div");
    chip.className = "image-chip";

    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);

    const remove = document.createElement("button");
    remove.textContent = "×";
    remove.onclick = () => {
      URL.revokeObjectURL(img.src);
      uploadedImages.splice(index,1);
      renderImagePreview();
    };

    chip.append(img,remove);
    preview.appendChild(chip);
  });
}

async function createImagePDF() {
  if (!uploadedImages.length) {
    alert("Please upload one or more images first.");
    return;
  }

  if (!window.jspdf) {
    alert("PDF library could not load. Check your internet connection and refresh.");
    return;
  }

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p","mm","a4");

    const pageWidth = 210;
    const pageHeight = 297;
    const margin = 10;

    for (let i=0; i<uploadedImages.length; i++) {
      const file = uploadedImages[i];

      const data = await readFileAsDataURL(file);
      const image = await loadImage(data);

      const maxWidth = pageWidth - margin*2;
      const maxHeight = pageHeight - margin*2;

      const ratio = Math.min(
        maxWidth/image.width,
        maxHeight/image.height
      );

      const width = image.width*ratio;
      const height = image.height*ratio;

      const x = (pageWidth-width)/2;
      const y = (pageHeight-height)/2;

      if (i > 0) pdf.addPage();

      const format = file.type.includes("png") ? "PNG" : "JPEG";
      pdf.addImage(data,format,x,y,width,height);
    }

    pdf.save("ZYROX-Images.pdf");

  } catch(error) {
    alert("Could not create PDF: " + error.message);
  }
}

function readFileAsDataURL(file) {
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function loadImage(src) {
  return new Promise((resolve,reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

/* =========================================
   TEXT AND PDF DOCUMENT READING
========================================= */

async function handleTextFile(event) {
  const file = event.target.files?.[0];
  event.target.value = "";
  if (!file) return;

  try {
    if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) {
      alert("PDF text extraction is not included in this version. You can use the Image button for images and Create PDF to combine them.");
      return;
    }

    const text = await file.text();
    pendingFileText = text.slice(0,30000);

    document.getElementById("prompt").value =
      "Please read and help me understand the uploaded document.";

    alert("Document loaded. Press Send to ask ZYROX about it.");
  } catch(error) {
    alert("Could not read this file.");
  }
}

/* =========================================
   VOICE INPUT
========================================= */

function toggleVoiceInput() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported in this browser. Try an updated version of Chrome.");
    return;
  }

  if (listening && recognition) {
    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    listening = true;
    document.getElementById("voiceButton").textContent = "🔴 Listening...";
  };

  recognition.onresult = event => {
    let transcript = "";

    for (let i=0; i<event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }

    document.getElementById("prompt").value = transcript;
    resizeInput(document.getElementById("prompt"));
  };

  recognition.onerror = () => {
    listening = false;
    document.getElementById("voiceButton").textContent = "🎙 Voice";
  };

  recognition.onend = () => {
    listening = false;
    document.getElementById("voiceButton").textContent = "🎙 Voice";
  };

  recognition.start();
}

/* =========================================
   VOICE OUTPUT
========================================= */

function toggleSpeak() {
  speakReplies = !speakReplies;

  document.getElementById("speakToggle").textContent =
    speakReplies ? "🔊 Read replies: ON" : "🔊 Read replies: OFF";

  if (!speakReplies) speechSynthesis.cancel();
}

function speakText(text) {
  if (!("speechSynthesis" in window)) {
    alert("Speech output is not supported in this browser.");
    return;
  }

  speechSynthesis.cancel();

  const cleanText = text
    .replace(/```[\s\S]*?```/g,"Code block omitted.")
    .replace(/[#*_`>\-|]/g," ")
    .replace(/\[([^\]]+)\]\([^)]+\)/g,"$1");

  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = "en-IN";
  utterance.rate = 1;
  utterance.pitch = 1;

  speechSynthesis.speak(utterance);
}

/* =========================================
   PDF EXPORT OF AI RESPONSE
========================================= */

function createResponsePDF(text) {
  if (!window.jspdf) {
    alert("PDF library is unavailable.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  const lines = pdf.splitTextToSize(text,180);
  let y = 15;

  pdf.setFontSize(17);
  pdf.text("ZYROX",15,y);
  y += 12;

  pdf.setFontSize(10);

  lines.forEach(line => {
    if (y > 280) {
      pdf.addPage();
      y = 15;
    }

    pdf.text(line,15,y);
    y += 6;
  });

  pdf.save("ZYROX-Response.pdf");
}

   EXPORT AND CLEAR
========================================= */

function exportChats() {
  const blob = new Blob(
    [JSON.stringify(chats,null,2)],
    {type:"application/json"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "ZYROX-Conversations.json";
  a.click();

  URL.revokeObjectURL(url);
}

function clearAllChats() {
  if (!confirm("Delete all saved conversations?")) return;

  chats = [];
  currentId = null;
  saveChats();
  newChat();
}

function exportCurrentChat() {
  const chat = getCurrentChat();
  if (!chat) return;

  const text = chat.messages.map(m =>
    (m.role === "user" ? "YOU" : "ZYROX") + "\n" + m.content
  ).join("\n\n----------------\n\n");

  const blob = new Blob([text],{type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "ZYROX-Conversation.txt";
  a.click();

  URL.revokeObjectURL(url);
}

if (!chats.length) {
  newChat();
} else {
  currentId = chats[0].id;
  renderHistory();
  renderChat();

document.getElementById("prompt").focus();
