
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090914">
<title>ZYROX AI — Think Beyond</title>

<style>
:root {
  --bg: #090914;
  --panel: #111121;
  --panel2: #17172a;
  --border: rgba(255,255,255,.09);
  --text: #f4f3ff;
  --muted: #9998b2;
  --accent: #9270ff;
  --accent2: #6848dc;
  --danger: #ff6c7a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
}

button, textarea, input, select {
  font: inherit;
}

button { cursor: pointer; }

.app {
  display: flex;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
}

/* SIDEBAR */

.sidebar {
  width: 270px;
  min-width: 270px;
  background: #0e0e1b;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px 14px;
  z-index: 20;
  transition: transform .25s ease;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 8px 8px 22px;
}

.logo {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg,#a58aff,#5937ce);
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 900;
  box-shadow: 0 5px 25px #754bff55;
}

.brand-name {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 1px;
}

.brand-sub {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  margin-top: 3px;
}

.new-chat {
  border: 1px solid #7958e8;
  background: linear-gradient(120deg,#7654df,#5132b4);
  color: white;
  border-radius: 12px;
  padding: 13px;
  font-weight: 700;
  margin-bottom: 22px;
}

.side-heading {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  padding: 8px;
}

.history {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

.history-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 10px;
  border-radius: 9px;
  color: #c9c7df;
  cursor: pointer;
  font-size: 13px;
  margin-bottom: 4px;
}

.history-item:hover,
.history-item.active {
  background: var(--panel2);
  color: white;
}

.history-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

.delete-chat {
  color: var(--muted);
  border: none;
  background: transparent;
  padding: 4px;
}

.delete-chat:hover { color: var(--danger); }

.sidebar-bottom {
  border-top: 1px solid var(--border);
  padding-top: 13px;
  color: var(--muted);
  font-size: 12px;
}

/* MAIN */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}

.topbar {
  min-height: 68px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  gap: 12px;
}

.top-left, .top-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.menu-btn {
  display: none;
  background: transparent;
  border: 0;
  color: white;
  font-size: 22px;
}

.status {
  color: #9d8aff;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #65e5a1;
  box-shadow: 0 0 9px #65e5a1;
}

.mode-select {
  background: var(--panel2);
  color: white;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 9px 11px;
  outline: none;
  max-width: 130px;
}

.icon-btn {
  border: 1px solid var(--border);
  background: var(--panel);
  color: white;
  padding: 9px 11px;
  border-radius: 9px;
}

.icon-btn:hover { background: var(--panel2); }

/* CHAT */

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 28px 16px 30px;
  scroll-behavior: smooth;
}

.messages {
  max-width: 850px;
  margin: auto;
}

.welcome {
  min-height: 55vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.welcome-logo {
  width: 76px;
  height: 76px;
  border-radius: 24px;
  display: grid;
  place-items: center;
  font-size: 36px;
  font-weight: 900;
  background: linear-gradient(135deg,#a58aff,#5937ce);
  box-shadow: 0 8px 45px #7955ff45;
  margin-bottom: 22px;
}

.welcome h1 {
  font-size: clamp(28px,5vw,43px);
  margin: 0 0 12px;
  letter-spacing: -1px;
}

.gradient-text {
  background: linear-gradient(90deg,#b39aff,#8b72ff,#d2a6ff);
  color: transparent;
  background-clip: text;
}

.welcome p {
  color: var(--muted);
  max-width: 460px;
  line-height: 1.7;
  margin: 0 0 25px;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 10px;
  width: min(100%,550px);
}

.suggestion {
  text-align: left;
  border: 1px solid var(--border);
  background: var(--panel);
  color: #dedcf2;
  border-radius: 12px;
  padding: 14px;
  font-size: 13px;
  line-height: 1.5;
}

.suggestion:hover {
  border-color: #8567ed;
  background: var(--panel2);
}

.message {
  display: flex;
  gap: 12px;
  margin: 22px 0;
  align-items: flex-start;
}

.avatar {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 13px;
}

.user-avatar { background: #292442; }
.ai-avatar { background: linear-gradient(135deg,#9472ff,#5937c6); }

.message-body {
  min-width: 0;
  flex: 1;
  line-height: 1.75;
  overflow-wrap: anywhere;
}

.message-role {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 5px;
  font-weight: 700;
}

.message-content {
  font-size: 14px;
  color: #e9e7f5;
}

.message-content p { margin: 7px 0 13px; }
.message-content h1,
.message-content h2,
.message-content h3 { line-height: 1.3; }

.message-content pre {
  background: #080811;
  border: 1px solid var(--border);
  padding: 14px;
  border-radius: 10px;
  overflow-x: auto;
}

.message-content code {
  font-family: Consolas, monospace;
  background: #24213b;
  border-radius: 4px;
  padding: 2px 4px;
}

.message-content pre code {
  background: transparent;
  padding: 0;
}

.message-content table {
  border-collapse: collapse;
  width: 100%;
  display: block;
  overflow-x: auto;
}

.message-content th,
.message-content td {
  border: 1px solid var(--border);
  padding: 8px;
  text-align: left;
}

.message-content blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 12px;
  color: #c7c0e5;
}

.message-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.message-actions button {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 5px 9px;
  border-radius: 7px;
  font-size: 11px;
}

.message-actions button:hover { color: white; }

.typing {
  color: var(--muted);
  font-size: 13px;
  padding: 12px 0;
}

/* COMPOSER */

.composer-wrap {
  padding: 12px 16px 18px;
  border-top: 1px solid var(--border);
  background: #0b0b17;
}

.composer-inner {
  max-width: 850px;
  margin: auto;
}

.attachment-preview {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  margin-bottom: 9px;
}

.preview-item {
  position: relative;
  flex-shrink: 0;
  width: 72px;
  height: 72px;
}

.preview-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 9px;
  border: 1px solid var(--border);
}

.remove-image {
  position: absolute;
  top: -5px;
  right: -5px;
  border: none;
  border-radius: 50%;
  background: #e45168;
  color: white;
  width: 21px;
  height: 21px;
}

.file-preview {
  background: var(--panel2);
  padding: 10px;
  border-radius: 8px;
  color: var(--muted);
  font-size: 12px;
}

.composer {
  border: 1px solid #34314f;
  background: #151525;
  border-radius: 16px;
  padding: 10px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
}

.composer:focus-within {
  border-color: #8867f1;
  box-shadow: 0 0 0 2px #8867f122;
}

#prompt {
  flex: 1;
  min-width: 0;
  resize: none;
  max-height: 160px;
  min-height: 40px;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  padding: 10px 4px;
  font-size: 14px;
  line-height: 1.5;
}

#prompt::placeholder { color: #77758e; }

.tool-btn {
  flex-shrink: 0;
  width: 39px;
  height: 39px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: #22213a;
  color: white;
  font-size: 17px;
}

.tool-btn:hover { background: #38305c; }

.send-btn {
  background: linear-gradient(135deg,#9775ff,#6948d8);
  border: none;
  color: white;
}

.send-btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.composer-note {
  color: #77758e;
  font-size: 10px;
  text-align: center;
  margin-top: 9px;
}

/* PDF BUTTON */

.pdf-button {
  display: none;
  border: 1px solid #7559d7;
  background: #211b3d;
  color: #d8caff;
  padding: 8px 12px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 10px;
}

.pdf-button:hover { background: #33275d; }

/* MOBILE */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 15;
}

@media(max-width:750px) {
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    height: 100dvh;
    transform: translateX(-105%);
  }

  .sidebar.open { transform: translateX(0); }
  .overlay.show { display: block; }
  .menu-btn { display: block; }

  .topbar { padding: 0 12px; min-height: 60px; }
  .top-left { gap: 8px; }
  .top-right { gap: 6px; }
  .status { font-size: 10px; }
  .mode-select { max-width: 105px; padding: 8px 5px; font-size: 11px; }

  .chat-area { padding: 15px 12px 20px; }
  .composer-wrap { padding: 10px 10px 13px; }
  .suggestions { grid-template-columns: 1fr; }
  .welcome { min-height: 48vh; }
  .welcome p { font-size: 13px; }
  .message { gap: 9px; }
  .avatar { width: 30px; height: 30px; }
  .message-content { font-size: 13px; }
  .tool-btn { width: 35px; height: 37px; }
}

@media(max-width:390px) {
  .status { display: none; }
  .brand-name { font-size: 19px; }
  .topbar { padding: 0 8px; }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">Z</div>
      <div>
        <div class="brand-name">ZYROX</div>
        <div class="brand-sub">THINK BEYOND</div>
      </div>
    </div>

    <button class="new-chat" id="newChatBtn">＋ New Chat</button>

    <div class="side-heading">YOUR CONVERSATIONS</div>
    <div class="history" id="history"></div>

    <div class="sidebar-bottom">
      <div>ZYROX AI</div>
      <div style="margin-top:5px">Your intelligent workspace</div>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="status">
          <span class="status-dot"></span>
          AI SYSTEM ONLINE
        </div>
      </div>

      <div class="top-right">
        <select class="mode-select" id="modeSelect" title="Response mode">
          <option value="instant">⚡ Instant</option>
          <option value="balanced" selected>◈ Balanced</option>
          <option value="deep">✦ Deep</option>
        </select>
        <button class="icon-btn" id="exportBtn" title="Export conversation">⇩</button>
      </div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="messages" id="messages"></div>
    </section>

    <section class="composer-wrap">
      <div class="composer-inner">

        <div class="attachment-preview" id="attachmentPreview"></div>

        <button class="pdf-button" id="createPdfBtn">
          ⇩ Create PDF from images
        </button>

        <div class="composer">
          <input type="file" id="imageInput" accept="image/*" multiple hidden>
          <input type="file" id="documentInput" accept=".txt,.md,.csv,.json" hidden>

          <button class="tool-btn" id="imageBtn" title="Upload images">＋</button>
          <button class="tool-btn" id="fileBtn" title="Upload text file">▤</button>

          <textarea id="prompt" rows="1" placeholder="Message ZYROX..."></textarea>

          <button class="tool-btn" id="micBtn" title="Voice input">🎙</button>
          <button class="tool-btn send-btn" id="sendBtn" title="Send message">➤</button>
          <button class="tool-btn" id="stopBtn" title="Stop response" style="display:none">■</button>
        </div>

        <div class="composer-note">
          ZYROX can make mistakes. Check important information.
        </div>
      </div>
    </section>
  </main>
</div>

<script>
/* =========================================
   ZYROX CONFIGURATION
========================================= */

const API_URL =
  "https://mindx-ai-backend.msdonix7979.workers.dev/api/chat";

const STORAGE_KEY = "mindx-ai-chats-v1";

const $ = id => document.getElementById(id);

let chats = [];
let currentChatId = null;
let uploadedImages = [];
let pendingFileText = "";
let pendingFileName = "";
let abortController = null;
let recognition = null;
let speaking = false;

/* =========================================
   STORAGE AND CHAT MANAGEMENT
========================================= */

function saveChats() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
  } catch (error) {
    console.error("Could not save chats:", error);
  }
}

function loadChats() {
  try {
    chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (!Array.isArray(chats)) chats = [];
  } catch {
    chats = [];
  }

  if (chats.length) {
    currentChatId = chats[0].id;
  }

  renderHistory();
  renderCurrentChat();
}

function currentChat() {
  return chats.find(chat => chat.id === currentChatId);
}

function createChat() {
  const chat = {
    id: Date.now().toString(),
    title: "New conversation",
    messages: [],
    createdAt: Date.now()
  };

  chats.unshift(chat);
  currentChatId = chat.id;

  saveChats();
  renderHistory();
  renderCurrentChat();
  closeSidebar();
  $("prompt").focus();
}

function selectChat(id) {
  currentChatId = id;
  renderHistory();
  renderCurrentChat();
  closeSidebar();
}

function deleteChat(id) {
  chats = chats.filter(chat => chat.id !== id);

  if (currentChatId === id) {
    currentChatId = chats[0]?.id || null;
  }

  if (!currentChatId) createChat();

  saveChats();
  renderHistory();
  renderCurrentChat();
}

function renderHistory() {
  const history = $("history");
  history.innerHTML = "";

  chats.forEach(chat => {
    const item = document.createElement("div");
    item.className =
      "history-item" + (chat.id === currentChatId ? " active" : "");

    const title = document.createElement("span");
    title.className = "history-title";
    title.textContent = chat.title || "New conversation";

    title.onclick = () => selectChat(chat.id);

    const del = document.createElement("button");
    del.className = "delete-chat";
    del.textContent = "×";
    del.title = "Delete conversation";
    del.onclick = event => {
      event.stopPropagation();
      deleteChat(chat.id);
    };

    item.append(title, del);
    history.appendChild(item);
  });
}

function renderCurrentChat() {
  const chat = currentChat();

  if (!chat || !chat.messages.length) {
    renderWelcome();
    return;
  }

  $("messages").innerHTML = "";

  chat.messages.forEach(message => {
    addMessageElement(message.role, message.content, false);
  });

  scrollToBottom();
}

function renderWelcome() {
  $("messages").innerHTML = `
    <div class="welcome">
      <div class="welcome-logo">Z</div>
      <h1>Welcome to <span class="gradient-text">ZYROX</span></h1>
      <p>Your intelligent AI workspace. Ask questions, explore ideas,
      learn new things and create something amazing.</p>

      <div class="suggestions">
        <button class="suggestion" data-prompt="Explain artificial intelligence in simple words.">
          ✦ Explain something difficult
        </button>
        <button class="suggestion" data-prompt="Give me creative project ideas.">
          ◈ Generate creative ideas
        </button>
        <button class="suggestion" data-prompt="Help me write a professional email.">
          ▤ Help me write something
        </button>
        <button class="suggestion" data-prompt="Teach me a useful coding concept.">
          ⌘ Teach me coding
        </button>
      </div>
    </div>
  `;

  document.querySelectorAll(".suggestion").forEach(button => {
    button.onclick = () => {
      $("prompt").value = button.dataset.prompt;
      $("prompt").focus();
      autoResize();
    };
  });
}

/* =========================================
   MESSAGE DISPLAY
========================================= */

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function basicMarkdown(text) {
  let safe = escapeHTML(text);

  safe = safe.replace(/```([\s\S]*?)```/g,
    (_, code) => `<pre><code>${code.trim()}</code></pre>`);

  safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
  safe = safe.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  safe = safe.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  safe = safe.replace(/^# (.*)$/gm, "<h1>$1</h1>");
  safe = safe.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  safe = safe.replace(/\*(.*?)\*/g, "<em>$1</em>");
  safe = safe.replace(/^---$/gm, "<hr>");
  safe = safe.replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>");
  safe = safe.replace(/^\s*[-*] (.*)$/gm, "<li>$1</li>");
  safe = safe.replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>");
  safe = safe.replace(/\n/g, "<br>");

  return safe;
}

function addMessageElement(role, content, shouldScroll = true) {
  const messages = $("messages");

  const welcome = messages.querySelector(".welcome");
  if (welcome) messages.innerHTML = "";

  const wrapper = document.createElement("div");
  wrapper.className = "message";

  const avatar = document.createElement("div");
  avatar.className =
    "avatar " + (role === "user" ? "user-avatar" : "ai-avatar");
  avatar.textContent = role === "user" ? "Y" : "Z";

  const body = document.createElement("div");
  body.className = "message-body";

  const roleLabel = document.createElement("div");
  roleLabel.className = "message-role";
  roleLabel.textContent = role === "user" ? "YOU" : "ZYROX";

  const contentDiv = document.createElement("div");
  contentDiv.className = "message-content";
  contentDiv.innerHTML = basicMarkdown(content);

  body.append(roleLabel, contentDiv);

  if (role === "assistant") {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const copy = document.createElement("button");
    copy.textContent = "Copy";
    copy.onclick = () => {
      navigator.clipboard.writeText(content).then(() => {
        copy.textContent = "Copied!";
        setTimeout(() => copy.textContent = "Copy", 1200);
      });
    };

    const speak = document.createElement("button");
    speak.textContent = "Speak";
    speak.onclick = () => speakText(content);

    actions.append(copy, speak);
    body.appendChild(actions);
  }

  wrapper.append(avatar, body);
  messages.appendChild(wrapper);

  if (shouldScroll) scrollToBottom();
}

function addMessage(role, content) {
  const chat = currentChat();
  if (!chat) return;

  chat.messages.push({ role, content });

  if (role === "user" && chat.title === "New conversation") {
    chat.title = content.slice(0, 35) || "New conversation";
  }

  saveChats();
  renderHistory();
  addMessageElement(role, content);
}

function scrollToBottom() {
  const area = $("chatArea");
  area.scrollTop = area.scrollHeight;
}

/* =========================================
   PDF CREATION — WITH TWO CDN FALLBACKS
========================================= */

let pdfLibraryPromise = null;

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");

    script.src = src;
    script.async = true;

    script.onload = () => resolve();
    script.onerror = () => {
      script.remove();
      reject(new Error("Could not load PDF library."));
    };

    document.head.appendChild(script);
  });
}

async function loadPDFLibrary() {
  if (window.jspdf?.jsPDF) return window.jspdf.jsPDF;

  if (pdfLibraryPromise) return pdfLibraryPromise;

  pdfLibraryPromise = (async () => {
    const sources = [
      "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js",
      "https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"
    ];

    for (const source of sources) {
      try {
        await loadScript(source);

        if (window.jspdf?.jsPDF) {
          return window.jspdf.jsPDF;
        }
      } catch (error) {
        console.warn("PDF library source failed:", source);
      }
    }

    throw new Error(
      "PDF library could not load. Check your internet connection."
    );
  })();

  try {
    return await pdfLibraryPromise;
  } catch (error) {
    pdfLibraryPromise = null;
    throw error;
  }
}

function imageFileToJPEG(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onerror = () => reject(new Error("Could not read image."));

    reader.onload = () => {
      const image = new Image();

      image.onerror = () => reject(new Error("Could not open image."));

      image.onload = () => {
        const canvas = document.createElement("canvas");

        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;

        const context = canvas.getContext("2d");

        if (!context) {
          reject(new Error("Could not process image."));
          return;
        }

        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0);

        try {
          resolve({
            data: canvas.toDataURL("image/jpeg", 0.92),
            width: canvas.width,
            height: canvas.height
          });
        } catch {
          reject(new Error("Could not convert image."));
        }
      };

      image.src = reader.result;
    };

    reader.readAsDataURL(file);
  });
}

async function createImagePDF() {
  if (!uploadedImages.length) {
    alert("Please upload at least one image first.");
    return;
  }

  const button = $("createPdfBtn");
  button.disabled = true;
  button.textContent = "Preparing your PDF...";

  try {
    const jsPDF = await loadPDFLibrary();

    const pdf = new jsPDF({
      orientation: "portrait",
      unit: "mm",
      format: "a4",
      compress: true
    });

    const pageWidth = 210;
    const pageHeight = 297;
    const margin = 10;

    for (let index = 0; index < uploadedImages.length; index++) {
      const file = uploadedImages[index];

      const image = await imageFileToJPEG(file);

      if (index > 0) {
        pdf.addPage();
      }

      const availableWidth = pageWidth - margin * 2;
      const availableHeight = pageHeight - margin * 2;

      const ratio = Math.min(
        availableWidth / image.width,
        availableHeight / image.height
      );

      const width = image.width * ratio;
      const height = image.height * ratio;

      const x = (pageWidth - width) / 2;
      const y = (pageHeight - height) / 2;

      pdf.addImage(
        image.data,
        "JPEG",
        x,
        y,
        width,
        height,
        undefined,
        "FAST"
      );
    }

    pdf.save("ZYROX-Images.pdf");

  } catch (error) {
    console.error("PDF creation error:", error);
    alert(
      error.message ||
      "Could not create PDF. Please try again."
    );

  } finally {
    button.disabled = false;
    button.textContent = "⇩ Create PDF from images";
  }
}

/* =========================================
   IMAGE UPLOAD AND PREVIEW
========================================= */

function renderAttachments() {
  const preview = $("attachmentPreview");
  preview.innerHTML = "";

  uploadedImages.forEach((file, index) => {
    const item = document.createElement("div");
    item.className = "preview-item";

    const image = document.createElement("img");
    image.src = URL.createObjectURL(file);

    const remove = document.createElement("button");
    remove.className = "remove-image";
    remove.textContent = "×";

    remove.onclick = () => {
      uploadedImages.splice(index, 1);
      renderAttachments();
    };

    item.append(image, remove);
    preview.appendChild(item);
  });

  if (pendingFileName) {
    const file = document.createElement("div");
    file.className = "file-preview";
    file.textContent = "▤ " + pendingFileName;

    preview.appendChild(file);
  }

  $("createPdfBtn").style.display =
    uploadedImages.length ? "block" : "none";
}

$("imageBtn").onclick = () => $("imageInput").click();

$("imageInput").onchange = event => {
  const files = Array.from(event.target.files || []);

  const validFiles = files.filter(file =>
    file.type.startsWith("image/")
  );

  uploadedImages.push(...validFiles);

  renderAttachments();
  event.target.value = "";
};

$("createPdfBtn").onclick = createImagePDF;

/* =========================================
   TEXT FILE UPLOAD
========================================= */

$("fileBtn").onclick = () => $("documentInput").click();

$("documentInput").onchange = async event => {
  const file = event.target.files?.[0];
  if (!file) return;

  try {
    pendingFileText = await file.text();
    pendingFileName = file.name;

    renderAttachments();

    $("prompt").value =
      `Please read and help me with the attached text file: ${file.name}`;

    autoResize();

  } catch {
    alert("Could not read this file.");
  }

  event.target.value = "";
};

/* =========================================
   SEND MESSAGE TO CLOUDFLARE
========================================= */

function getMode() {
  return $("modeSelect").value;
}

async function sendMessage() {
  const prompt = $("prompt").value.trim();

  if (!prompt && !pendingFileText) return;

  if (abortController) return;

  if (!currentChatId) createChat();

  let finalText = prompt;

  if (pendingFileText) {
    finalText +=
      "\n\nFile name: " + pendingFileName +
      "\n\nFile contents:\n" + pendingFileText;
  }

  if (uploadedImages.length) {
    finalText +=
      "\n\n[The user has attached " +
      uploadedImages.length +
      " image(s). The images are available for creating a PDF in the interface. Do not claim to have viewed their contents.]";
  }

  $("prompt").value = "";
  autoResize();

  addMessage("user", finalText);

  pendingFileText = "";
  pendingFileName = "";

  // Keep image attachments available for PDF creation.
  renderAttachments();

  const chat = currentChat();

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.id = "typingIndicator";
  typing.textContent = "ZYROX is thinking...";
  $("messages").appendChild(typing);
  scrollToBottom();

  abortController = new AbortController();

  $("sendBtn").style.display = "none";
  $("stopBtn").style.display = "block";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      signal: abortController.signal,
      body: JSON.stringify({
        messages: chat.messages.slice(-30),
        mode: getMode()
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed.");
    }

    const reply = data?.choices?.[0]?.message?.content;

    if (typeof reply !== "string" || !reply.trim()) {
      throw new Error("ZYROX returned an empty response.");
    }

    $("typingIndicator")?.remove();
    addMessage("assistant", reply);

  } catch (error) {
    $("typingIndicator")?.remove();

    if (error.name === "AbortError") {
      addMessage("assistant", "Response stopped.");
    } else {
      addMessage(
        "assistant",
        "Sorry, I couldn't complete that request.\n\n" +
        error.message
      );
    }

  } finally {
    abortController = null;
    $("sendBtn").style.display = "block";
    $("stopBtn").style.display = "none";
    $("prompt").focus();
  }
}

$("sendBtn").onclick = sendMessage;

$("stopBtn").onclick = () => {
  if (abortController) abortController.abort();
};

/* =========================================
   TEXTAREA BEHAVIOUR
========================================= */

function autoResize() {
  const textarea = $("prompt");
  textarea.style.height = "auto";
  textarea.style.height =
    Math.min(textarea.scrollHeight, 160) + "px";
}

$("prompt").addEventListener("input", autoResize);

$("prompt").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

/* =========================================
   VOICE INPUT
========================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = event => {
    const spoken = event.results[0][0].transcript;
    $("prompt").value +=
      ($("prompt").value ? " " : "") + spoken;
    autoResize();
  };

  recognition.onerror = () => {
    $("micBtn").textContent = "🎙";
  };

  recognition.onend = () => {
    $("micBtn").textContent = "🎙";
  };
}

$("micBtn").onclick = () => {
  if (!recognition) {
    alert("Voice input is not supported in this browser. Try Chrome.");
    return;
  }

  try {
    recognition.start();
    $("micBtn").textContent = "🔴";
  } catch {
    recognition.stop();
    $("micBtn").textContent = "🎙";
  }
};

/* =========================================
   VOICE OUTPUT
========================================= */

function speakText(text) {
  if (!("speechSynthesis" in window)) {
    alert("Voice output is not supported in this browser.");
    return;
  }

  if (speaking) {
    speechSynthesis.cancel();
    speaking = false;
    return;
  }

  const cleanText = text
    .replace(/```[\s\S]*?```/g, "Code block omitted.")
    .replace(/[#*`>|]/g, "")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");

  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = "en-IN";
  utterance.rate = 1;

  utterance.onstart = () => speaking = true;
  utterance.onend = () => speaking = false;
  utterance.onerror = () => speaking = false;

  speechSynthesis.speak(utterance);
}

/* =========================================
   EXPORT CONVERSATION
========================================= */

$("exportBtn").onclick = () => {
  const chat = currentChat();

  if (!chat || !chat.messages.length) {
    alert("There is no conversation to export.");
    return;
  }

  const text = chat.messages.map(message => {
    return (
      (message.role === "user" ? "YOU" : "ZYROX") +
      "\n" + message.content
    );
  }).join("\n\n-------------------------\n\n");

  const blob = new Blob([text], {
    type: "text/plain;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "ZYROX-Conversation.txt";
  link.click();

  URL.revokeObjectURL(url);
};

/* =========================================
   MOBILE SIDEBAR
========================================= */

function openSidebar() {
  $("sidebar").classList.add("open");
  $("overlay").classList.add("show");
}

function closeSidebar() {
  $("sidebar").classList.remove("open");
  $("overlay").classList.remove("show");
}

$("menuBtn").onclick = openSidebar;
$("overlay").onclick = closeSidebar;

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeSidebar();
});

/* =========================================
   NEW CHAT
========================================= */

$("newChatBtn").onclick = createChat;

/* =========================================
   START APPLICATION
========================================= */

loadChats();

if (!currentChatId) {
  createChat();
}
</script>
