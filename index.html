
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090714">
<title>ZYROX — Think Beyond</title>

<!-- Free browser libraries -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>

<style>
:root {
  --bg:#090714;
  --panel:#100d20;
  --panel2:#19132d;
  --text:#f4f0ff;
  --muted:#a39bb8;
  --accent:#a78bfa;
  --border:rgba(255,255,255,.10);
  --user:#302052;
  --hue:260;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
  transition:background 1s ease;
}

body.animated {
  background:
    linear-gradient(
      125deg,
      hsl(var(--hue) 45% 9%),
      hsl(calc(var(--hue) + 65) 48% 13%),
      hsl(calc(var(--hue) + 135) 45% 10%)
    );
}

body.light {
  --bg:#f4f2fa;
  --panel:#ffffff;
  --panel2:#eeeaf7;
  --text:#201a30;
  --muted:#756d85;
  --border:rgba(30,20,50,.12);
  --user:#e5dafa;
  background:var(--bg);
}

button,input,textarea {
  font:inherit;
}

button {
  cursor:pointer;
}

#app {
  height:100%;
  display:flex;
}

/* SIDEBAR */

.sidebar {
  width:270px;
  min-width:270px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:18px;
  overflow:hidden;
  flex-shrink:0;
  transition:width .25s,padding .25s,transform .25s;
  z-index:20;
}

.sidebar.closed {
  width:0;
  min-width:0;
  padding:0;
  border:0;
}

.brand {
  display:flex;
  align-items:center;
  gap:11px;
  font-size:23px;
  font-weight:850;
  letter-spacing:2px;
  margin-bottom:25px;
  white-space:nowrap;
}

.logo {
  width:37px;
  height:37px;
  flex-shrink:0;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#8b5cf6,#d946ef);
  color:white;
  font-weight:900;
}

.close-sidebar {
  display:none;
  margin-left:auto;
}

.new-chat,.primary {
  border:0;
  border-radius:12px;
  padding:13px;
  background:linear-gradient(110deg,#7c3aed,#a855f7);
  color:white;
  font-weight:700;
}

.new-chat {
  width:100%;
  margin-bottom:14px;
}

.search {
  width:100%;
  padding:11px 12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel2);
  color:var(--text);
  outline:none;
  margin-bottom:17px;
}

.section-label {
  color:var(--muted);
  font-size:11px;
  letter-spacing:1.4px;
  margin:7px 0 10px;
}

.history {
  overflow-y:auto;
  flex:1;
}

.chat-item {
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px;
  border-radius:10px;
  margin-bottom:4px;
  color:var(--muted);
  min-width:0;
}

.chat-item:hover,.chat-item.active {
  background:var(--panel2);
  color:var(--text);
}

.chat-title {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1;
  font-size:13px;
  cursor:pointer;
}

.chat-actions {
  display:flex;
  gap:3px;
}

.chat-actions button {
  border:0;
  background:transparent;
  color:var(--muted);
  padding:3px;
  font-size:13px;
}

.chat-actions button:hover {
  color:var(--text);
}

.sidebar-bottom {
  border-top:1px solid var(--border);
  padding-top:13px;
}

.sidebar-bottom button {
  width:100%;
  padding:10px;
  border:0;
  border-radius:9px;
  color:var(--muted);
  background:transparent;
  text-align:left;
}

.sidebar-bottom button:hover {
  background:var(--panel2);
  color:var(--text);
}

/* MOBILE OVERLAY */

#sidebarOverlay {
  display:none;
}

/* MAIN AREA */

.main {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  height:100%;
}

.topbar {
  height:65px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid var(--border);
  background:var(--panel);
}

.top-left,.top-right {
  display:flex;
  align-items:center;
  gap:12px;
}

.icon-btn {
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 11px;
}

.status {
  color:#4ade80;
  font-size:12px;
  display:flex;
  align-items:center;
  gap:6px;
}

.dot {
  width:7px;
  height:7px;
  background:#4ade80;
  border-radius:50%;
}

/* CHAT AREA */

#messages {
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:35px 16px 25px;
  scroll-behavior:smooth;
}

.welcome {
  max-width:760px;
  margin:9vh auto 0;
  text-align:center;
}

.welcome h1 {
  font-size:clamp(34px,6vw,55px);
  margin:0 0 10px;
  background:linear-gradient(100deg,#c4b5fd,#e879f9,#818cf8);
  color:transparent;
  background-clip:text;
}

.welcome p {
  color:var(--muted);
  font-size:15px;
}

.suggestions {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin:35px auto;
  max-width:650px;
}

.suggestion {
  text-align:left;
  padding:17px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  transition:.2s;
}

.suggestion:hover {
  border-color:var(--accent);
  transform:translateY(-2px);
}

.suggestion strong {
  display:block;
  margin-bottom:6px;
}

.suggestion span {
  font-size:12px;
  color:var(--muted);
}

.message {
  max-width:850px;
  margin:0 auto 25px;
  display:flex;
  gap:13px;
  align-items:flex-start;
}

.avatar {
  width:33px;
  height:33px;
  border-radius:11px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7c3aed,#c026d3);
  font-size:13px;
  font-weight:bold;
  color:white;
}

.message.user .avatar {
  background:#51416f;
}

.content {
  min-width:0;
  flex:1;
  line-height:1.7;
  overflow-wrap:anywhere;
}

.message.user .content {
  background:var(--user);
  padding:12px 15px;
  border-radius:5px 15px 15px 15px;
}

.content p {
  margin:0 0 12px;
}

.content p:last-child {
  margin-bottom:0;
}

.content pre {
  overflow-x:auto;
  background:#090714;
  padding:15px;
  border-radius:10px;
  border:1px solid var(--border);
}

.content code {
  font-family:Consolas,monospace;
  background:var(--panel2);
  padding:2px 5px;
  border-radius:5px;
}

.content pre code {
  background:none;
  padding:0;
}

.content table {
  border-collapse:collapse;
  width:100%;
  display:block;
  overflow-x:auto;
}

.content th,.content td {
  border:1px solid var(--border);
  padding:9px;
  text-align:left;
}

.content blockquote {
  border-left:3px solid var(--accent);
  padding-left:13px;
  color:var(--muted);
}

.content img {
  max-width:100%;
  border-radius:10px;
}

.message-tools {
  display:flex;
  gap:6px;
  margin-top:8px;
  flex-wrap:wrap;
}

.message-tools button {
  border:0;
  background:transparent;
  color:var(--muted);
  padding:5px;
  font-size:12px;
}

.message-tools button:hover {
  color:var(--text);
}

.typing {
  color:var(--muted);
  font-size:13px;
}

/* MESSAGE COMPOSER */

.composer-area {
  flex-shrink:0;
  padding:12px 18px 18px;
  background:var(--bg);
}

.composer {
  max-width:850px;
  margin:auto;
  border:1px solid var(--border);
  border-radius:17px;
  background:var(--panel);
  padding:12px;
}

.composer textarea {
  display:block;
  width:100%;
  resize:none;
  min-height:45px;
  max-height:180px;
  background:transparent;
  color:var(--text);
  border:0;
  outline:none;
  padding:8px;
}

.composer-bottom {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.tools,.send-tools {
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
}

.small-btn {
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--panel2);
  color:var(--muted);
  padding:8px 10px;
}

.small-btn:hover {
  color:var(--text);
}

.send-btn {
  border:0;
  border-radius:10px;
  background:#8b5cf6;
  color:white;
  padding:10px 17px;
  font-weight:700;
}

.send-btn:disabled {
  opacity:.5;
  cursor:not-allowed;
}

.disclaimer {
  text-align:center;
  font-size:10px;
  color:var(--muted);
  margin-top:9px;
}

#attachment {
  font-size:12px;
  color:var(--accent);
  padding:4px 8px;
  display:none;
}

.hidden {
  display:none!important;
}

#fileInput {
  display:none;
}

/* MOBILE FIX */

@media(max-width:700px) {

  .sidebar {
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    width:min(290px,85vw);
    min-width:0;
    height:100dvh;
    padding:18px;
    box-shadow:10px 0 40px #0008;
    transform:translateX(0);
  }

  .sidebar.closed {
    display:flex;
    width:min(290px,85vw);
    min-width:0;
    padding:18px;
    border-right:1px solid var(--border);
    transform:translateX(-110%);
  }

  .close-sidebar {
    display:block;
  }

  #sidebarOverlay {
    position:fixed;
    inset:0;
    z-index:15;
    background:rgba(0,0,0,.58);
  }

  #sidebarOverlay.visible {
    display:block;
  }

  .main {
    width:100%;
    min-width:0;
  }

  .topbar {
    height:58px;
    padding:0 12px;
  }

  .status {
    display:none;
  }

  #messages {
    padding:20px 12px;
  }

  .welcome {
    margin:8vh auto 0;
  }

  .suggestions {
    grid-template-columns:1fr;
    margin:25px auto;
  }

  .composer-area {
    padding:8px;
    padding-bottom:max(8px,env(safe-area-inset-bottom));
  }

  .composer {
    padding:9px;
  }

  .composer textarea {
    min-height:42px;
  }

  .message {
    gap:9px;
  }

  .avatar {
    width:29px;
    height:29px;
  }
}
</style>
</head>

<body class="animated">

<div id="app">

  <div id="sidebarOverlay" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">Z</div>
      ZYROX
      <button class="icon-btn close-sidebar"
        onclick="closeSidebar()">✕</button>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New Chat
    </button>

    <input
      class="search"
      id="search"
      placeholder="⌕ Search conversations..."
      oninput="renderHistory()"
    >

    <div class="section-label">YOUR CONVERSATIONS</div>
    <div class="history" id="history"></div>

    <div class="sidebar-bottom">
      <button onclick="exportAll()">⇩ Export all chats</button>
      <button onclick="showSettings()">⚙ Settings & themes</button>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn" onclick="toggleSidebar()">☰</button>
        <strong>ZYROX</strong>
      </div>

      <div class="top-right">
        <span class="status">
          <span class="dot"></span> AI ONLINE
        </span>
        <button class="icon-btn" onclick="newChat()">＋</button>
      </div>
    </header>

    <section id="messages"></section>

    <div class="composer-area">

      <div class="composer">

        <div id="attachment"></div>

        <textarea
          id="prompt"
          placeholder="Message ZYROX..."
          rows="1"
        ></textarea>

        <div class="composer-bottom">

          <div class="tools">
            <button class="small-btn"
              onclick="document.getElementById('fileInput').click()">
              ＋ File
            </button>

            <input
              id="fileInput"
              type="file"
              accept=".txt,.md,.csv,.json,.pdf"
              multiple
            >

            <button class="small-btn" onclick="startVoice()">
              🎙 Voice
            </button>

            <button class="small-btn" onclick="webSearch()">
              ⌕ Web
            </button>
          </div>

          <div class="send-tools">
            <button
              class="small-btn hidden"
              id="stopBtn"
              onclick="stopGeneration()">
              ■ Stop
            </button>

            <button
              class="send-btn"
              id="sendBtn"
              onclick="sendMessage()">
              Send ↑
            </button>
          </div>

        </div>
      </div>

      <div class="disclaimer">
        ZYROX can make mistakes. Check important information.
      </div>

    </div>
  </main>
</div>

<script>
/* CONFIGURATION */

const API_URL =
  "https://mindx-ai-backend.msdonix7979.workers.dev/api/chat";

const STORAGE_KEY = "mindx-ai-chats-v1";

let chats = [];
let currentId = null;
let busy = false;
let controller = null;
let pendingText = "";

/* LOAD SAVED CHATS */

try {
  chats = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  if (!Array.isArray(chats)) chats = [];
} catch {
  chats = [];
}

const messagesEl = document.getElementById("messages");
const promptEl = document.getElementById("prompt");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("sidebarOverlay");

/* BACKGROUND COLOUR CHANGES EVERY SECOND */

let hue = 260;

setInterval(() => {
  hue = (hue + 35) % 360;
  document.documentElement.style.setProperty("--hue",hue);
},1000);

/* STORAGE */

function save() {
  try {
    localStorage.setItem(STORAGE_KEY,JSON.stringify(chats));
  } catch {
    alert("Browser storage is full. Export your chats and remove old conversations.");
  }
}

function uid() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2,8);
}

function currentChat() {
  return chats.find(c => c.id === currentId);
}

/* CHAT MANAGEMENT */

function newChat() {
  const chat = {
    id:uid(),
    title:"New conversation",
    messages:[],
    pinned:false,
    updated:Date.now()
  };

  chats.unshift(chat);
  currentId = chat.id;

  save();
  renderAll();
  promptEl.focus();
  closeSidebar();
}

function openChat(id) {
  currentId = id;
  renderAll();
  closeSidebar();
}

function deleteChat(id) {
  if (!confirm("Delete this conversation?")) return;

  chats = chats.filter(c => c.id !== id);

  if (currentId === id) {
    currentId = chats[0]?.id || null;
  }

  save();
  renderAll();
}

function renameChat(id) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;

  const name = prompt("Enter a new conversation name:",chat.title);

  if (name && name.trim()) {
    chat.title = name.trim();
    save();
    renderHistory();
  }
}

function togglePin(id) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;

  chat.pinned = !chat.pinned;
  save();
  renderHistory();
}

function renderHistory() {
  const term = document.getElementById("search").value.toLowerCase();
  const el = document.getElementById("history");

  el.innerHTML = "";

  const ordered = [...chats].sort((a,b) =>
    Number(b.pinned)-Number(a.pinned) || b.updated-a.updated
  );

  ordered.filter(chat => {
    const text = (
      chat.title + " " +
      chat.messages.map(m => m.content || "").join(" ")
    ).toLowerCase();

    return text.includes(term);

  }).forEach(chat => {

    const item = document.createElement("div");
    item.className = "chat-item" +
      (chat.id === currentId ? " active" : "");

    const title = document.createElement("span");
    title.className = "chat-title";
    title.textContent =
      (chat.pinned ? "📌 " : "") + chat.title;

    title.onclick = () => openChat(chat.id);

    const actions = document.createElement("div");
    actions.className = "chat-actions";

    const rename = document.createElement("button");
    rename.textContent = "✎";
    rename.title = "Rename";
    rename.onclick = e => {
      e.stopPropagation();
      renameChat(chat.id);
    };

    const pin = document.createElement("button");
    pin.textContent = chat.pinned ? "★" : "☆";
    pin.title = "Pin";
    pin.onclick = e => {
      e.stopPropagation();
      togglePin(chat.id);
    };

    const del = document.createElement("button");
    del.textContent = "×";
    del.title = "Delete";
    del.onclick = e => {
      e.stopPropagation();
      deleteChat(chat.id);
    };

    actions.append(rename,pin,del);
    item.append(title,actions);
    el.append(item);
  });
}

/* WELCOME SCREEN */

function welcomeHTML() {
  return `
  <div class="welcome">
    <h1>Think Beyond.</h1>
    <p>Your ideas. Your questions. One intelligent space.</p>

    <div class="suggestions">

      <button class="suggestion"
        onclick="usePrompt('Explain a difficult topic simply')">
        <strong>✦ Learn something</strong>
        <span>Understand complex topics easily</span>
      </button>

      <button class="suggestion"
        onclick="usePrompt('Help me write a creative project')">
        <strong>✎ Create something</strong>
        <span>Write, plan and brainstorm</span>
      </button>

      <button class="suggestion"
        onclick="usePrompt('Help me debug this code')">
        <strong>⌘ Code assistant</strong>
        <span>Understand and improve code</span>
      </button>

      <button class="suggestion"
        onclick="usePrompt('Give me ideas for a new project')">
        <strong>⚡ Explore ideas</strong>
        <span>Discover new possibilities</span>
      </button>

    </div>
  </div>`;
}

function renderAll() {
  renderHistory();
  renderMessages();
}

function renderMessages() {
  const chat = currentChat();

  messagesEl.innerHTML = "";

  if (!chat || !chat.messages.length) {
    messagesEl.innerHTML = welcomeHTML();
    return;
  }

  chat.messages.forEach((m,index) => {

    const row = document.createElement("div");
    row.className = "message " + m.role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = m.role === "user" ? "Y" : "Z";

    const area = document.createElement("div");
    area.className = "content";

    const body = document.createElement("div");

    if (m.role === "assistant") {
      body.innerHTML = DOMPurify.sanitize(
        marked.parse(m.content || "")
      );
    } else {
      body.textContent = m.content || "";
    }

    area.append(body);

    if (m.role === "assistant") {

      const tools = document.createElement("div");
      tools.className = "message-tools";

      const copy = document.createElement("button");
      copy.textContent = "Copy";
      copy.onclick = () => {
        navigator.clipboard.writeText(m.content);
      };

      const regen = document.createElement("button");
      regen.textContent = "Regenerate";
      regen.onclick = () => regenerate(index);

      const pdf = document.createElement("button");
      pdf.textContent = "Create PDF";
      pdf.onclick = () => exportPDF(chat);

      tools.append(copy,regen,pdf);
      area.append(tools);
    }

    row.append(avatar,area);
    messagesEl.append(row);
  });

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function usePrompt(text) {
  promptEl.value = text;
  promptEl.focus();
}

/* AI CHAT */

function ensureChat() {
  if (!currentChat()) newChat();
  return currentChat();
}

function makeTitle(chat,text) {
  if (chat.messages.length === 1) {
    chat.title = text.slice(0,42) || "New conversation";
  }
}

async function sendMessage() {
  if (busy) return;

  const text = promptEl.value.trim();

  if (!text && !pendingText) return;

  const chat = ensureChat();

  const finalText =
    text +
    (pendingText
      ? "\n\nAttached file content:\n" + pendingText
      : "");

  pendingText = "";

  document.getElementById("attachment").style.display = "none";
  document.getElementById("attachment").textContent = "";

  promptEl.value = "";
  promptEl.style.height = "auto";

  chat.messages.push({
    role:"user",
    content:finalText
  });

  makeTitle(chat,finalText);
  chat.updated = Date.now();

  save();
  renderAll();

  await requestAI(chat);
}

async function requestAI(chat) {
  busy = true;
  controller = new AbortController();

  document.getElementById("sendBtn").disabled = true;
  document.getElementById("stopBtn").classList.remove("hidden");

  const typing = document.createElement("div");
  typing.className = "message";
  typing.innerHTML =
    '<div class="avatar">Z</div>' +
    '<div class="content typing">ZYROX is thinking...</div>';

  messagesEl.append(typing);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {

    const response = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},

      body:JSON.stringify({
        messages:chat.messages.slice(-20).map(m => ({
          role:m.role,
          content:m.content
        }))
      }),

      signal:controller.signal
    });

    if (!response.ok) {
      throw new Error("Server error: " + response.status);
    }

    const data = await response.json();

    const answer =
      data.reply ||
      data.message ||
      data.choices?.[0]?.message?.content;

    if (!answer) {
      throw new Error("The AI returned an empty response.");
    }

    chat.messages.push({
      role:"assistant",
      content:answer
    });

    chat.updated = Date.now();
    save();

  } catch(error) {

    if (error.name !== "AbortError") {
      chat.messages.push({
        role:"assistant",
        content:
          "I couldn't get a response. Please try again.\n\nError: " +
          error.message
      });

      save();
    }

  } finally {

    busy = false;
    controller = null;

    document.getElementById("sendBtn").disabled = false;
    document.getElementById("stopBtn").classList.add("hidden");

    renderAll();
  }
}

function stopGeneration() {
  if (controller) {
    controller.abort();
  }
}

async function regenerate(index) {
  if (busy) return;

  const chat = currentChat();

  if (!chat || chat.messages[index]?.role !== "assistant") {
    return;
  }

  chat.messages.splice(index);

  save();
  renderMessages();

  await requestAI(chat);
}

/* SIDEBAR CONTROLS */

function isMobile() {
  return window.matchMedia("(max-width:700px)").matches;
}

function toggleSidebar() {
  if (sidebar.classList.contains("closed")) {
    sidebar.classList.remove("closed");
  } else {
    sidebar.classList.add("closed");
  }

  updateOverlay();
}

function closeSidebar() {
  if (isMobile()) {
    sidebar.classList.add("closed");
  }

  updateOverlay();
}

function updateOverlay() {
  if (isMobile() && !sidebar.classList.contains("closed")) {
    overlay.classList.add("visible");
  } else {
    overlay.classList.remove("visible");
  }
}

function updateMobileLayout() {
  if (isMobile()) {
    sidebar.classList.add("closed");
  } else {
    sidebar.classList.remove("closed");
  }

  updateOverlay();
}

/* EXPORT CONVERSATION AS TEXT */

function exportChat(chat) {
  if (!chat) return;

  const content = chat.messages.map(m =>
    (m.role === "user" ? "YOU" : "ZYROX") +
    "\n" + m.content
  ).join("\n\n--------------------\n\n");

  download(
    chat.title.replace(/[^\w-]/g,"_") + ".txt",
    content,
    "text/plain;charset=utf-8"
  );
}

/* CREATE PDF */

function exportPDF(chat) {
  if (!chat || !chat.messages.length) {
    alert("There are no messages to export.");
    return;
  }

  if (!window.jspdf) {
    alert("PDF library could not load. Check your internet connection and refresh.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();

  const margin = 15;
  const usableWidth = pageWidth - margin * 2;

  let y = 20;

  doc.setFont("helvetica","bold");
  doc.setFontSize(20);
  doc.text("ZYROX",margin,y);

  y += 10;

  doc.setFont("helvetica","normal");
  doc.setFontSize(10);
  doc.text("Conversation: " + chat.title,margin,y);

  y += 12;

  doc.setDrawColor(180);
  doc.line(margin,y,pageWidth-margin,y);

  y += 10;

  chat.messages.forEach(message => {

    const heading = message.role === "user" ? "YOU" : "ZYROX";

    doc.setFont("helvetica","bold");
    doc.setFontSize(11);

    if (y > pageHeight - 25) {
      doc.addPage();
      y = 20;
    }

    doc.text(heading,margin,y);
    y += 7;

    doc.setFont("helvetica","normal");
    doc.setFontSize(10);

    const safeText = String(message.content || "")
      .replace(/[^\x20-\x7E\n\r\t]/g," ");

    const lines = doc.splitTextToSize(safeText,usableWidth);

    for (const line of lines) {
      if (y > pageHeight - 15) {
        doc.addPage();
        y = 20;
      }

      doc.text(line,margin,y);
      y += 5;
    }

    y += 7;
  });

  const filename =
    (chat.title || "ZYROX-conversation")
      .replace(/[^\w-]/g,"_") + ".pdf";

  doc.save(filename);
}

/* EXPORT ALL CHATS */

function exportAll() {
  download(
    "zyrox-conversations.json",
    JSON.stringify(chats,null,2),
    "application/json"
  );
}

function download(name,content,type) {
  const blob = new Blob([content],{type:type});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();

  URL.revokeObjectURL(url);
}

/* THEMES */

function showSettings() {
  const choice = prompt(
    "ZYROX APPEARANCE\n\n" +
    "1 = Animated changing colours\n" +
    "2 = Static dark theme\n" +
    "3 = Light theme"
  );

  document.body.classList.remove("animated","light");

  if (choice === "1") {
    document.body.classList.add("animated");
  }

  if (choice === "3") {
    document.body.classList.add("light");
  }

  localStorage.setItem("zyrox-theme",choice || "2");
}

/* WEB SEARCH */

function webSearch() {
  const query = prompt("What would you like to search for?");

  if (query && query.trim()) {
    window.open(
      "https://www.google.com/search?q=" +
      encodeURIComponent(query),
      "_blank"
    );
  }
}

/* VOICE INPUT */

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported in this browser. Try Chrome.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.interimResults = false;

  recognition.onresult = e => {
    promptEl.value +=
      (promptEl.value ? " " : "") +
      e.results[0][0].transcript;

    promptEl.focus();
  };

  recognition.onerror = () => {
    alert("Voice recognition could not start.");
  };

  recognition.start();
}

/* FILE READING */

async function readFile(file) {
  const attachment = document.getElementById("attachment");

  attachment.style.display = "block";

  if (file.type === "application/pdf" ||
      file.name.toLowerCase().endsWith(".pdf")) {

    try {
      attachment.textContent = "Reading PDF...";

      const buffer = await file.arrayBuffer();

      const pdf = await pdfjsLib.getDocument({
        data:buffer
      }).promise;

      let text = "";

      for (let i=1;i<=pdf.numPages;i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();

        text += content.items.map(x=>x.str).join(" ") + "\n";
      }

      pendingText +=
        "\n[PDF: " + file.name + "]\n" +
        text.slice(0,15000);

      attachment.textContent = "PDF ready: " + file.name;

    } catch {
      attachment.textContent = "Could not read this PDF.";
    }

    return;
  }

  if (file.size > 1000000) {
    attachment.textContent =
      "File too large. Maximum size: 1 MB.";
    return;
  }

  try {
    const text = await file.text();

    pendingText +=
      "\n[File: " + file.name + "]\n" +
      text.slice(0,15000);

    attachment.textContent = "File ready: " + file.name;

  } catch {
    attachment.textContent = "Could not read this file.";
  }
}

document.getElementById("fileInput").addEventListener(
  "change",
  async e => {
    for (const file of e.target.files) {
      await readFile(file);
    }

    e.target.value = "";
  }
);

/* KEYBOARD CONTROLS */

promptEl.addEventListener("keydown",e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

promptEl.addEventListener("input",() => {
  promptEl.style.height = "auto";

  promptEl.style.height =
    Math.min(promptEl.scrollHeight,180) + "px";
});

document.addEventListener("keydown",e => {

  if ((e.ctrlKey || e.metaKey) &&
      e.key.toLowerCase() === "k") {

    e.preventDefault();
    document.getElementById("search").focus();
  }

  if ((e.ctrlKey || e.metaKey) &&
      e.key.toLowerCase() === "n") {

    e.preventDefault();
    newChat();
  }

  if (e.key === "Escape") {
    closeSidebar();
  }
});

/* PDF WORKER */

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

/* LOAD THEME */

const savedTheme = localStorage.getItem("zyrox-theme");

if (savedTheme === "2") {
  document.body.classList.remove("animated");
}

if (savedTheme === "3") {
  document.body.classList.remove("animated");
  document.body.classList.add("light");
}

/* INITIALIZE */

if (chats.length) {
  currentId = chats[0].id;
} else {
  newChat();
}

updateMobileLayout();
renderAll();

window.addEventListener("resize",updateMobileLayout);
</script>
